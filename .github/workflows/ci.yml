name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helmet
          POSTGRES_PASSWORD: test
          POSTGRES_DB: helmet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helmet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://helmet:test@localhost:5432/helmet_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt
      - run: ruff check services/api
      - run: alembic upgrade head
        working-directory: services/api
      - run: pytest services/api tests/integration

  vision:
    name: Vision (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r services/vision/requirements.txt -r services/vision/requirements-dev.txt
      - run: ruff check services/vision
      - run: pytest services/vision

  web:
    name: Web (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test --if-present
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [api, vision, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  secrets-guard:
    name: Cek kebocoran secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
